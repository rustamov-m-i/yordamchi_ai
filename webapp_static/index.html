<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yordamchi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --brand:#6C5CE7; --brand-d:#5a4fd0; --brand-soft:#ECE9FB;
    --bg:#F5F4FB; --card:#fff; --text:#15152b; --muted:#6b6b85; --faint:#9a9ab0;
    --soft:#f2f1f8; --line:#eceaf5; --green:#1E9E75; --amber:#E8A317; --red:#d64545; --blue:#2f7ae5;
  }
@media (prefers-color-scheme:dark){:root:not(.tglight){--bg:#17171f;--card:#23232e;--text:#e9e9f0;--muted:#a2a2b2;--faint:#70707f;--line:#2f2f3b;--soft:#2e2e3a;--brand-soft:#2b2542;--brand-d:#b3a9f0;}}
html.tgdark{--bg:#17171f;--card:#23232e;--text:#e9e9f0;--muted:#a2a2b2;--faint:#70707f;--line:#2f2f3b;--soft:#2e2e3a;--brand-soft:#2b2542;--brand-d:#b3a9f0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);font-size:16px;padding-bottom:92px}
  .screen{padding:14px 16px 0;display:none}
  .screen.on{display:block}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .head h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em}
  .head .sub{font-size:13px;color:var(--muted)}
  .icobtn{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);display:flex;
          align-items:center;justify-content:center;color:var(--brand);font-size:19px;border:none}
  .hero{background:var(--brand);border-radius:20px;padding:16px 18px;color:#fff;margin-bottom:16px}
  .hero .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9}
  .hero .pct{font-size:38px;font-weight:600;margin:6px 0 2px}
  .hero .stats{display:flex;margin-top:14px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 0}
  .hero .stats div{flex:1;text-align:center}
  .hero .stats div+div{border-left:1px solid rgba(255,255,255,.22)}
  .hero .stats b{font-size:18px;font-weight:600;display:block}
  .hero .stats span{font-size:11px;opacity:.85}
  .sec{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
  .sec h2{margin:0;font-size:16px;font-weight:600}
  .sec a{font-size:13px;color:var(--brand)}
  .trow{display:flex;align-items:center;gap:11px;background:var(--card);border-left:3px solid var(--brand);
        border-radius:13px;padding:12px 13px;margin-bottom:9px}
  .cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;
        align-items:center;justify-content:center;color:#fff;font-size:14px;background:transparent}
  .cbox.done{background:var(--green);border-color:var(--green)}
  .trow .t{flex:1;min-width:0}
  .trow .t .ti-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .t .ti-sub{font-size:11px;color:var(--faint);margin-top:1px}
  .trow.done .ti-title{text-decoration:line-through;color:var(--faint)}
  .trow .side{font-size:11px;color:var(--muted);text-align:right;flex:none}
  .card{background:var(--card);border-radius:16px;padding:14px 15px;margin-bottom:10px}
  .chip{font-size:11px;padding:2px 9px;border-radius:20px;display:inline-block}
  .chip.violet{background:var(--brand-soft);color:var(--brand-d)}
  .chip.red{background:#fbe6e6;color:var(--red)}.chip.amber{background:#fdf1dd;color:#9a6800}
  .chip.gray{background:var(--soft);color:var(--muted)}
  .chip.prog{background:#e7f0ff;color:#1e5aa8}.chip.block{background:#fdeceb;color:#c0392b}
  .trow.sub{margin-bottom:6px}
  .subgrp{margin:3px 0 9px 10px;border-left:2px solid var(--line);padding-left:8px}
  .subgrp .trow:last-child{margin-bottom:0}
  .cnt{font-size:10px;color:var(--muted);background:var(--soft);padding:1px 7px;border-radius:20px;margin-left:6px}
  /* ── Vazifalar tab — timeline ── */
  .tflt{display:flex;gap:8px;margin-bottom:15px}
  .tflt button{border:none;border-radius:20px;padding:8px 17px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
  .tflt button.on{background:var(--brand);color:#fff}
  .tline{position:relative;padding-left:30px}
  .tline::before{content:'';position:absolute;left:14px;top:13px;bottom:13px;width:2px;background:var(--line)}
  .tnode{position:relative;margin-bottom:11px}
  .tnode::before{content:'';position:absolute;left:-23px;top:19px;width:15px;height:15px;border-radius:50%;
    border:2.5px solid var(--rc,var(--brand));background:var(--bg);box-sizing:border-box;z-index:1}
  .tkard{background:var(--card);border-radius:15px;padding:13px 14px;box-shadow:0 1px 3px rgba(20,20,43,.05)}
  .tktop{display:flex;align-items:flex-start;gap:11px}
  .tkcb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:14px;margin-top:1px;background:transparent}
  .tkcb.on{background:var(--brand);border-color:var(--brand)}
  .tktitle{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
  .tkdays{font-size:11px;font-weight:600;flex:none;white-space:nowrap;margin-top:2px}
  .tkdays.d-red{color:var(--red)}.tkdays.d-amber{color:var(--amber)}.tkdays.d-mute{color:var(--faint)}
  .tkmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:9px 0 0 33px}
  .tkmeta .who{font-size:11.5px;color:var(--faint)}
  .tkexp{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 33px;font-size:12px;color:var(--muted)}
  .tkexp i.tw{font-size:14px;color:var(--faint)}.tkexp i.ch{font-size:15px;transition:transform .15s}
  .tnode.done .tktitle{text-decoration:line-through;color:var(--faint)}
  .tsubs{display:none;margin:9px 0 2px 33px;position:relative;padding-left:18px}
  .tsubs.open{display:block}
  .tsubs::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tsubi{position:relative;display:flex;align-items:flex-start;gap:9px;padding:7px 0}
  .tsubi::before{content:'';position:absolute;left:-13.5px;top:12px;width:9px;height:9px;border-radius:50%;
    background:var(--rc,var(--brand));z-index:1}
  .tsubi .tkcb{width:19px;height:19px;border-radius:6px;font-size:12px;margin-top:0}
  .tsubi .st{flex:1;min-width:0;font-size:13px;line-height:1.35}
  .tsubi .sw{font-size:11px;color:var(--faint);margin-top:2px}
  .tsubi.done .st{color:var(--faint)}.tsubi.done .stt{text-decoration:line-through}
  /* ── Uchrashuvlar tab — timeline + detail + bayonnoma ── */
  .flt{display:flex;gap:8px;margin-bottom:15px}
  .flt button{border:none;border-radius:20px;padding:8px 17px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
  .flt button.on{background:var(--brand);color:#fff}
  .mtl{position:relative}
  .grp{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 9px 46px}
  .grp:first-child{margin-top:2px}
  .mrow{position:relative;display:flex;margin-bottom:10px}
  .mtime{width:38px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--muted);padding-top:12px}
  .mrail{width:24px;flex:none;position:relative}
  .mrail::before{content:"";position:absolute;left:11px;top:-11px;bottom:-11px;width:2px;background:var(--line)}
  .mdot{position:absolute;left:5px;top:14px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--brand);background:var(--bg);box-sizing:border-box;z-index:1}
  .mdot.done{background:var(--green);border-color:var(--green);display:flex;align-items:center;justify-content:center}
  .mdot.done i{font-size:9px;color:#fff}
  .mc{flex:1;background:var(--card);border-radius:14px;padding:11px 13px;border:.5px solid var(--line);min-width:0}
  .mc.dim{opacity:.68}
  .mt{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
  .mm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mm i{font-size:14px;color:var(--brand);opacity:.7;flex:none}
  .mm+.mm{margin-top:3px}
  .mbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip.green{background:#e1f5ee;color:#0f6e56}
  .drow{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--text);margin-bottom:11px}
  .drow i{font-size:19px;color:var(--brand);flex:none}
  .drow a{color:var(--brand);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dlbl{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 9px}
  .ppl{display:flex;flex-wrap:wrap;gap:7px}
  .pc{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:20px;padding:3px 12px 3px 3px;font-size:12.5px;color:var(--text)}
  .av{width:23px;height:23px;border-radius:50%;background:var(--brand-soft);color:var(--brand-d);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .dnote{font-size:13.5px;color:var(--muted);line-height:1.55;background:var(--soft);border-radius:12px;padding:11px 13px}
  .protobox{background:var(--soft);border-radius:12px;padding:12px 13px;font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;max-height:210px;overflow:auto}
  .dlrow{display:flex;gap:8px;margin-top:10px}
  .aibar{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--brand-soft);
    border-radius:14px;padding:11px 13px;margin-bottom:14px;color:var(--brand-d);font-size:13px;box-shadow:0 1px 4px rgba(108,92,231,.1)}
  .aibar i{color:var(--brand);font-size:18px}.aibar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
  .ov.show{display:flex}
  .ov .ovh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);background:var(--card)}
  .ov .ovh input{flex:1;border:none;background:none;font-size:16px;padding:6px 0}
  .ov .ovh input:focus{outline:none}
  .ov .ovb{flex:1;overflow:auto;padding:12px 14px 20px}
  .msg{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14px;margin-bottom:9px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg.u{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
  .msg.a{background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:5px}
  .chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
  .chatin input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:16px}
  .chatin input:focus{outline:none;border-color:var(--brand)}
  .chatin button{border:none;background:var(--brand);color:#fff;width:42px;border-radius:50%;font-size:18px;flex:none}
  /* AI-chat inline result cards (show_* → structured data) */
  .cv{max-width:92%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px 5px;margin:0 0 10px}
  .cvh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:0 11px 7px;display:flex;align-items:center;gap:6px}
  .cvh i{color:var(--brand);font-size:15px}
  .cvr{display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid var(--line);font-size:13.5px}
  .cvr>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cvd{width:8px;height:8px;border-radius:50%;flex:none}.cvd2{color:var(--brand);font-size:15px;flex:none}
  .cvm{font-size:11px;color:var(--faint);flex:none}
  .cvmore{padding:7px 11px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
  .cvopen{padding:9px 11px;font-size:12.5px;font-weight:600;color:var(--brand);border-top:1px solid var(--line)}
  .cvempty{padding:9px 11px;font-size:13px;color:var(--faint)}
  .cvstat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .cvstat>div{background:var(--card);padding:10px 11px;display:flex;flex-direction:column;gap:2px}
  .cvstat b{font-size:20px;font-weight:700;color:var(--text)}.cvstat span{font-size:11px;color:var(--muted)}
  .cvdl{max-width:92%;margin:0 0 10px}
  .cvdl button{border:1.5px solid var(--brand);background:transparent;color:var(--brand);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .srhint{color:var(--faint);text-align:center;padding:30px 20px;font-size:13px}
  .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:2px 2px 8px}
  .radar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .tile{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
  .tile .num{font-size:24px;font-weight:700;line-height:1}.tile .tl{font-size:12px;color:var(--muted)}
  .rdot{width:8px;height:8px;border-radius:50%;flex:none}
  .next{background:var(--brand);color:#fff;border-radius:14px;padding:13px;margin-bottom:9px}
  .tl2{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tl2:last-child{border:none}.tl2 .tm{font-size:11px;color:var(--faint);width:44px;flex:none}
  .warn{background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;gap:10px;font-size:13px}
  .pulse{background:var(--card);border-radius:14px;padding:13px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .qa{display:flex;gap:8px}.qa div{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}.qa i{font-size:19px;color:var(--brand);display:block;margin-bottom:3px}
  .rowbtns{display:flex;gap:7px;margin-top:10px}
  .btn{border:none;font-size:12px;padding:7px 11px;border-radius:10px;background:var(--soft);color:var(--text)}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.dang{background:transparent;color:var(--red)}
  .empty{text-align:center;color:var(--faint);padding:48px 20px}
  .empty i{font-size:40px;display:block;margin-bottom:10px;color:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qcard{background:var(--card);border-radius:16px;padding:14px;text-align:center}
  .qcard i{font-size:24px;color:var(--brand)}
  .qcard div{font-size:13px;margin-top:6px;font-weight:500}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;width:52px;height:52px;
       border-radius:50%;background:var(--brand);color:#fff;font-size:26px;display:flex;
       align-items:center;justify-content:center;border:none;box-shadow:0 6px 16px rgba(108,92,231,.45);z-index:8}
  nav{position:fixed;left:14px;right:14px;bottom:16px;height:58px;background:var(--card);
      border-radius:20px;display:flex;align-items:center;box-shadow:0 6px 20px rgba(60,50,120,.13);z-index:7}
  nav button{flex:1;background:none;border:none;color:var(--faint);font-size:21px;padding:0}
  nav button.on{color:var(--brand)}
  nav .gap{flex:1}
  .mbg{position:fixed;inset:0;background:rgba(20,18,45,.5);display:none;z-index:20;align-items:flex-end}
  .mbg.show{display:flex}
  .modal{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
  .modal h3{margin:2px 0 14px;font-size:17px;font-weight:600}
  label{display:block;font-size:12px;color:var(--faint);margin:11px 0 4px}
  input,textarea,select{width:100%;padding:11px 13px;font-size:16px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card);color:var(--text);font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
  textarea{min-height:70px;resize:vertical}
  .macts{display:flex;gap:10px;margin-top:18px}
  .macts .btn{flex:1;padding:13px;font-size:15px;border-radius:13px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2a2740;color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
  .toast.show{opacity:.96}
  .bar{display:flex;align-items:flex-end;gap:8px;height:130px;padding:0 4px}
  .bar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end}
  .bar .col .b{width:70%;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px}
  .bar .col small{font-size:10px;color:var(--faint)}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .menu .mi{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .menu .mi i{color:var(--brand);font-size:20px}
  .menu .mi .ch{margin-left:auto;color:var(--faint)}
</style>
</head>
<body>

<div class="screen on" id="v-dash"></div>
<div class="screen" id="v-tasks"></div>
<div class="screen" id="v-meetings"></div>
<div class="screen" id="v-notes"></div>
<div class="screen" id="v-reminders"></div>
<div class="screen" id="v-insights"></div>
<div class="screen" id="v-profile"></div>
<div class="screen" id="v-protocols"></div>
<div class="screen" id="v-team"></div>
<div class="screen" id="v-risks"></div>
<div class="screen" id="v-categories"></div>
<div class="screen" id="v-calendar"></div>

<button class="fab" id="fab"><i class="ti ti-plus"></i></button>
<nav>
  <button data-v="dash" class="on"><i class="ti ti-home-2"></i></button>
  <button data-v="tasks"><i class="ti ti-checkbox"></i></button>
  <span class="gap"></span>
  <button data-v="meetings"><i class="ti ti-calendar"></i></button>
  <button data-v="profile"><i class="ti ti-user"></i></button>
</nav>

<div class="mbg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<div class="ov" id="searchov">
  <div class="ovh"><button class="icobtn" onclick="closeOv('searchov')"><i class="ti ti-arrow-left"></i></button>
    <input id="searchq" placeholder="Qidirish (vazifa, uchrashuv, qayd)..." oninput="doSearch(this.value)"></div>
  <div class="ovb" id="searchres"><div class="srhint">Kamida 2 harf yozing</div></div>
</div>
<div class="ov" id="chatov">
  <div class="ovh"><button class="icobtn" onclick="closeOv('chatov')"><i class="ti ti-arrow-left"></i></button>
    <div style="font-weight:600"><i class="ti ti-sparkles" style="color:var(--brand);vertical-align:-2px"></i> Yordamchi AI</div></div>
  <div class="ovb" id="chatmsgs"></div>
  <div class="chatin"><button id="micbtn" onclick="toggleMic()" style="background:var(--soft);color:var(--brand)"><i class="ti ti-microphone"></i></button>
    <input id="chatq" placeholder="Yozing yoki so'rang..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()"><i class="ti ti-arrow-up"></i></button></div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
function _applyTheme(){if(tg&&tg.colorScheme)document.documentElement.classList.toggle("tgdark",tg.colorScheme==="dark");}
_applyTheme(); if(tg&&tg.onEvent)tg.onEvent("themeChanged",_applyTheme);
const AUTH="tma "+(tg?.initData||"");
let VIEW="dash", META={categories:[],contacts:[]};
// Row items are cached by id so edit handlers pass only the (safe) id in onclick —
// embedding JSON in an attribute breaks on the apostrophes that fill Uzbek text (o', g').
const CACHE={tasks:{},meetings:{},notes:{},reminders:{}};
const PRIO={P0:"Shoshilinch",P1:"Muhim",P2:"Rejadagi",P3:"Past"};
const STAT={in_progress:"Jarayonda",blocked:"Bloklangan",done:"Bajarildi",cancelled:"Bekor",todo:""};
const STATSEL={todo:"Rejada",in_progress:"Jarayonda",blocked:"Bloklangan",done:"Bajarildi",cancelled:"Bekor"};
const RECUR={"":"Takrorlanmaydi",daily:"Har kuni",weekdays:"Ish kunlari",weekly:"Har hafta",monthly:"Har oy",quarterly:"Har chorak",yearly:"Har yil"};

// Surface ANY uncaught error/rejection on-screen (Telegram has no visible console).
function _fatal(m){let b=document.getElementById("fatal");if(!b){b=document.createElement("div");
  b.id="fatal";b.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:999;background:#d64545;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;white-space:pre-wrap;box-shadow:0 3px 12px rgba(0,0,0,.3)";
  b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent="⚠️ "+m}
window.addEventListener("error",e=>_fatal((e.message||"error")+" @ "+(e.filename||"").split("/").pop()+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>_fatal("promise: "+((e.reason&&e.reason.message)||String(e.reason))));

async function api(p,o={}){const r=await fetch("/api"+p,{credentials:"same-origin",...o,headers:{"Authorization":AUTH,"Content-Type":"application/json",...(o.headers||{})}});
  if(!r.ok){let e="Xato "+r.status;try{e=(await r.json()).error||e}catch{}throw new Error(e)}return r.status===204?{}:r.json()}
function esc(s){return(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function flash(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function fmt(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return iso;return d.toLocaleString("uz",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function toLocal(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function fromLocal(v){return v?new Date(v).toISOString():null}
const $=id=>document.getElementById(id);
const el=id=>$("v-"+id);
function hdr(title,sub,icon){return `<div class="head"><div><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div><button class="icobtn" onclick="render(VIEW)" title="Yangilash"><i class="ti ti-refresh"></i></button></div>`}
function emptyBox(icon,txt){return `<div class="empty"><i class="ti ti-${icon}"></i>${esc(txt)}</div>`}

const _VIEWS={dash:"dash",tasks:"tasks",meetings:"meetings",notes:"notes",reminders:"reminders",insights:"insights",profile:"profile",protocols:"protocols",team:"team",risks:"risks",categories:"categories",calendar:"calendar"};
function switchView(v){VIEW=v;document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  el(_VIEWS[v]).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  render(v);window.scrollTo(0,0);}

async function render(v){
  const box=el(_VIEWS[v]);
  box.innerHTML='<div class="empty"><i class="ti ti-loader-2"></i>Yuklanmoqda… ·v4</div>';
  try{
    if(v==="dash")await renderDash(box);
    else if(v==="tasks")await renderTasks(box);
    else if(v==="meetings")await renderMeetings(box);
    else if(v==="notes")await renderNotes(box);
    else if(v==="reminders")await renderReminders(box);
    else if(v==="insights")await renderInsights(box);
    else if(v==="profile")await renderProfile(box);
    else if(v==="protocols")await renderProtocols(box);
    else if(v==="team")await renderTeam(box);
    else if(v==="risks")await renderRisks(box);
    else if(v==="categories")await renderCategories(box);
    else if(v==="calendar")await renderCalendar(box);
  }catch(e){box.innerHTML=hdr("Xatolik","")+emptyBox("alert-triangle",e.message)}
}

async function renderDash(box){
  const d=await api("/dashboard");const r=d.radar||{};const today=d.today||{};
  const tm=today.meetings||[],tt=today.tasks||[];
  tt.forEach(x=>CACHE.tasks[x.id]=x);tm.forEach(x=>CACHE.meetings[x.id]=x);
  const dstr=new Date().toLocaleDateString("uz",{day:"numeric",month:"long",weekday:"long"});
  let h=`<div class="head"><div><h1>Salom, Maqsud</h1><div class="sub">${dstr}</div></div>
    <div style="display:flex;gap:8px"><button class="icobtn" onclick="openSearch()"><i class="ti ti-search"></i></button>
    <button class="icobtn" onclick="go('reminders')"><i class="ti ti-bell"></i></button></div></div>
    <div class="aibar" onclick="openChat()"><i class="ti ti-sparkles"></i><span>Yordamchidan so'rang yoki buyuring…</span></div>`;
  // ── Diqqat radari ──
  const tile=(n,l,col,dot,v)=>`<div class="tile" onclick="go('${v}')"><span class="rdot" style="background:${dot}"></span><div><div class="num" style="color:${col}">${n||0}</div><div class="tl">${l}</div></div></div>`;
  h+=`<div class="lbl">Diqqat markazida</div><div class="radar">
    ${tile(r.total,"Jami vazifalar","var(--brand)","#6C5CE7","tasks")}
    ${tile(r.overdue,"Kechikkan","var(--red)","#d64545","risks")}
    ${tile(r.blocked,"Bloklangan","var(--text)","#8a8a9e","tasks")}
    ${tile(r.unassigned,"Ijrochisiz","var(--brand)","#6C5CE7","risks")}</div>`;
  // ── Bugungi kun ──
  h+=`<div class="sec"><h2>Bugungi kun</h2><a onclick="go('calendar')">To'liq →</a></div>`;
  const nx=today.next;
  if(nx&&nx.datetime_start){CACHE.meetings[nx.id]=nx;h+=`<div class="next" onclick="openMeeting('${nx.id}')"><div style="font-size:11px;opacity:.9">Keyingi uchrashuv</div><div style="font-size:16px;font-weight:600;margin:3px 0">${esc(nx.title)}</div><div style="font-size:12px;opacity:.9"><i class="ti ti-clock" style="vertical-align:-2px"></i> ${fmt(nx.datetime_start)}${nx.location_or_link?" · "+esc(nx.location_or_link):""}</div></div>`;}
  const items=[...tm.map(m=>({t:m.datetime_start,k:"m",o:m})),...tt.map(x=>({t:x.deadline,k:"t",o:x}))].filter(i=>i.t).sort((a,b)=>new Date(a.t)-new Date(b.t));
  if(items.length){h+='<div class="card">'+items.map(i=>{const dt=new Date(i.t);const hm=isNaN(dt)?"":dt.toLocaleTimeString("uz",{hour:"2-digit",minute:"2-digit"});
    if(i.k==="m")return `<div class="tl2" onclick="openMeeting('${i.o.id}')"><span class="tm">${hm}</span><i class="ti ti-users" style="color:var(--brand)"></i>${esc(i.o.title)}</div>`;
    const dn=i.o.status==="done";return `<div class="tl2" onclick="openTask('${i.o.id}')"><span class="tm">${hm}</span><i class="ti ti-${dn?'circle-check':'square'}" style="color:${dn?'var(--green)':(PCOL[i.o.priority]||'var(--brand)')}"></i><span style="${dn?'text-decoration:line-through;color:var(--faint)':''}">${esc(i.o.title)}</span></div>`;}).join("")+'</div>';}
  else h+=emptyBox("calendar","Bugunga reja yo'q");
  // ── Ustuvor vazifalar ──
  const pr=d.priority||[];
  if(pr.length){h+=`<div class="sec"><h2>Ustuvor vazifalar</h2><a onclick="go('tasks')">Barchasi →</a></div>`;pr.forEach(x=>{CACHE.tasks[x.id]=x;h+=taskRow(x);});}
  // ── Jamoa nazorati ──
  const team=d.team||{};const ol=team.overloaded||[],st=team.stale||[];
  if(ol.length||st.length){h+=`<div class="lbl" style="margin-top:14px">Jamoa nazorati</div>`;
    ol.forEach(p=>h+=`<div class="warn" onclick="go('team')"><i class="ti ti-user-exclamation" style="color:var(--amber);font-size:19px"></i><div><b style="font-weight:600">${esc(p.name)}</b> — ${p.active||0} aktiv${p.overdue?", "+p.overdue+" kechikkan":""} <span style="color:var(--faint)">(yuklama yuqori)</span></div></div>`);
    st.forEach(x=>{CACHE.tasks[x.id]=x;h+=`<div class="warn" onclick="openTask('${x.id}')"><i class="ti ti-clock-pause" style="color:var(--red);font-size:19px"></i><div>«${esc((x.title||'').slice(0,28))}» — ${Math.round(x.age_days||0)} kun${x.assignee?" · "+esc(x.assignee):""} <span style="color:var(--faint)">(turg'un)</span></div></div>`;});}
  // ── Haftalik pulse ──
  const pg=d.progress||0;const c=d.counts||{};
  h+=`<div class="pulse"><svg style="width:52px;height:52px;flex:none" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--soft)" stroke-width="4"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--brand)" stroke-width="4" stroke-dasharray="${pg} ${100-pg}" stroke-dashoffset="25" stroke-linecap="round"/><text x="18" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text)">${pg}%</text></svg>
    <div><div style="font-size:13px;font-weight:600">Haftalik pulse</div><div style="font-size:12px;color:var(--muted)">${c.done||0} bajarildi · ${c.pending||0} qoldi</div></div></div>`;
  // ── Tezkor amallar ──
  h+=`<div class="qa"><div onclick="openTask({})"><i class="ti ti-plus"></i>Vazifa</div><div onclick="go('protocols')"><i class="ti ti-file-text"></i>Bayonnoma</div><div onclick="download('/export/tasks?filter=active','vazifalar.xlsx')"><i class="ti ti-file-spreadsheet"></i>Eksport</div></div>`;
  box.innerHTML=h;
}
function taskRow(t,sub,nsub){const done=t.status==="done";const col=PCOL[t.priority]||"var(--brand)";
  const sc=t.status==="in_progress"?'<span class="chip prog">Jarayonda</span> '
          :t.status==="blocked"?'<span class="chip block">Bloklangan</span> '
          :t.status==="cancelled"?'<span class="chip gray">Bekor</span> ':'';
  const meta=(t.category||"")+(t.assignee?(t.category?" · ":"")+t.assignee:"");
  const cnt=nsub?`<span class="cnt"><i class="ti ti-subtask" style="font-size:11px;vertical-align:-1px"></i> ${nsub}</span>`:'';
  return `<div class="trow ${done?'done':''} ${sub?'sub':''}" style="border-left-color:${col}">
    <div class="cbox ${done?'done':''}" onclick="taskDone('${t.id}',event)">${done?'<i class="ti ti-check"></i>':''}</div>
    <div class="t" onclick="openTask('${t.id}')">
      <div class="ti-title">${esc(t.title)}${cnt}</div>
      <div class="ti-sub">${sc}${esc(meta)}</div></div>
    <div class="side">${t.deadline?fmt(t.deadline):""}</div></div>`}

let TFILTER="active";
const _pr=t=>({P0:0,P1:1,P2:2,P3:3}[t.priority]??2);
const _byPrioDl=(a,b)=>_pr(a)-_pr(b)||(a.deadline||"9999").localeCompare(b.deadline||"9999");
const _ACT=new Set(["todo","in_progress","blocked"]);
const _mf=t=>TFILTER==="all"?true:TFILTER==="done"?t.status==="done":_ACT.has(t.status);
let _openSubs=new Set();
const PCHIP={P0:"red",P1:"amber",P2:"violet",P3:"gray"};
// "X kun qoldi" / "Bugun" / "X kun kechikdi" — rangi shoshilinchlikка qarab.
function daysLeft(iso){if(!iso)return null;const d=new Date(iso);if(isNaN(d))return null;
  const n=new Date();const day=864e5;
  const dd=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/day);
  if(dd<0)return{t:`${-dd} kun kechikdi`,c:"d-red"};
  if(dd===0)return{t:"Bugun",c:"d-red"};
  if(dd===1)return{t:"Ertaga",c:"d-amber"};
  if(dd<=2)return{t:`${dd} kun qoldi`,c:"d-amber"};
  return{t:`${dd} kun qoldi`,c:"d-mute"};}
const _prioPill=p=>{const l=PRIO[p]||"";return l?`<span class="chip ${PCHIP[p]||'gray'}">${l}</span>`:"";};
const _statPill=s=>s==="in_progress"?'<span class="chip prog">Jarayonda</span>'
  :s==="blocked"?'<span class="chip block">Bloklangan</span>'
  :s==="cancelled"?'<span class="chip gray">Bekor</span>':"";
function _metaLine(t){const m=(t.category||"")+(t.assignee?(t.category?" · ":"")+t.assignee:"");return m?`<span class="who">${esc(m)}</span>`:"";}
const _cb=(t,done)=>`<div class="tkcb ${done?'on':''}" onclick="taskToggle('${t.id}',${done},event)">${done?'<i class="ti ti-check"></i>':''}</div>`;
function subRow(s){const done=s.status==="done";
  return `<div class="tsubi ${done?'done':''}" style="--rc:${PCOL[s.priority]||'var(--brand)'}">
    ${_cb(s,done)}<div class="st" onclick="openTask('${s.id}')"><span class="stt">${esc(s.title)}</span>${_metaLine(s)?`<div class="sw">${_metaLine(s)}</div>`:""}</div></div>`;}
function taskCard(t,kids){const done=t.status==="done";const dl=daysLeft(t.deadline);
  const dtot=kids.length,ddone=kids.filter(k=>k.status==="done").length;
  let sub="";
  if(kids.length){const open=_openSubs.has(t.id);
    sub=`<div class="tkexp" onclick="toggleSubs('${t.id}',event)"><i class="ti ti-corner-down-right tw"></i><span>${ddone}/${dtot} ichki vazifa</span><i class="ti ti-chevron-down ch" id="chev-${t.id}" style="${open?'transform:rotate(180deg)':''}"></i></div>
      <div class="tsubs ${open?'open':''}" id="subs-${t.id}">${kids.map(subRow).join("")}</div>`;}
  return `<div class="tnode ${done?'done':''}" style="--rc:${PCOL[t.priority]||'var(--brand)'}"><div class="tkard">
    <div class="tktop">${_cb(t,done)}<div class="tktitle" onclick="openTask('${t.id}')">${esc(t.title)}</div>${dl?`<div class="tkdays ${dl.c}">${dl.t}</div>`:""}</div>
    <div class="tkmeta">${_statPill(t.status)}${_prioPill(t.priority)}${_metaLine(t)}</div>${sub}</div></div>`;}
const taskToggle=(id,done,e)=>{if(e)e.stopPropagation();
  if(done)act(()=>api(`/tasks/${id}`,{method:"PATCH",body:JSON.stringify({status:"todo"})}),"Qayta ochildi");
  else act(()=>api(`/tasks/${id}/complete`,{method:"POST"}),"Bajarildi");};
function toggleSubs(id,e){if(e)e.stopPropagation();const el=document.getElementById("subs-"+id);if(!el)return;
  const open=el.classList.toggle("open");open?_openSubs.add(id):_openSubs.delete(id);
  const ch=document.getElementById("chev-"+id);if(ch)ch.style.transform=open?"rotate(180deg)":"";}
async function renderTasks(box){
  // Barcha vazifalarni bir marta olamiz — ota vazifa faol bo'lsa ham, uning
  // BARCHA ichki vazifalari (holatidan qat'i nazar) sanoq "1/3" va chizib tashlash
  // to'g'ri bo'lishi uchun kerak. Ota vazifalar filtr bo'yicha, ichkilar to'liq.
  const d=await api("/tasks?status=all");const list=d.tasks||[];
  list.forEach(x=>CACHE.tasks[x.id]=x);
  const kidsBy={};list.filter(t=>t.parent_id).forEach(s=>{(kidsBy[s.parent_id]=kidsBy[s.parent_id]||[]).push(s);});
  Object.values(kidsBy).forEach(a=>a.sort(_byPrioDl));
  const shown=list.filter(t=>!t.parent_id&&_mf(t)).sort(_byPrioDl);
  const shownIds=new Set(shown.map(p=>p.id));
  const rows=shown.map(p=>taskCard(p,kidsBy[p.id]||[])).join("");
  // Otasi shu filtrда ko'rinmaydigan (masalan ota bajarilган) va filtrga mos ichki vazifalar
  const orphans=list.filter(t=>t.parent_id&&!shownIds.has(t.parent_id)&&_mf(t)).sort(_byPrioDl);
  const orphHtml=orphans.length?('<div class="sec" style="margin:16px 2px 9px"><h2 style="font-size:13px;color:var(--faint)">Ichki vazifalar (ota boshqa ro\'yxatда)</h2></div><div class="tline">'+orphans.map(s=>taskCard(s,[])).join("")+'</div>'):"";
  const chip=(k,l)=>`<button class="${TFILTER===k?'on':''}" onclick="setTF('${k}')">${l}</button>`;
  box.innerHTML=hdr("Vazifalar","")+`<div class="tflt">${chip("active","Faol")}${chip("done","Bajarilgan")}${chip("all","Hammasi")}</div>`+
    (shown.length?'<div class="tline">'+rows+'</div>':"")+orphHtml+
    ((shown.length||orphans.length)?"":emptyBox("checklist","Vazifa yo'q"));
}
function setTF(k){TFILTER=k;render("tasks")}

let MFILTER="yaqin";
function setMF(k){MFILTER=k;render("meetings")}
function _hm(iso){const d=new Date(iso);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return `${p(d.getHours())}:${p(d.getMinutes())}`}
const _MON=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const _WD=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
function _dayLabel(iso){const d=new Date(iso);if(isNaN(d))return"";
  const t=new Date();const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const diff=Math.round((s(d)-s(t))/864e5);const dm=`${d.getDate()}-${_MON[d.getMonth()]}`;
  if(diff===0)return `Bugun · ${dm}`;if(diff===1)return `Ertaga · ${dm}`;if(diff===-1)return `Kecha · ${dm}`;
  return `${_WD[d.getDay()]} · ${dm}`}
function _initials(n){const p=(n||"").trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")||(n||"?").slice(0,2)).toUpperCase()}
function _isLink(s){return /^https?:\/\/|zoom|meet\.|teams|t\.me/i.test(s||"")}
function _hasProtocol(m){const fu=m&&m.follow_up_actions;const s=Array.isArray(fu)?(fu[0]||""):(typeof fu==="string"?fu:"");return typeof s==="string"&&s.trim().length>40&&s.includes(" ")}
function _protoText(m){const fu=m&&m.follow_up_actions;return (Array.isArray(fu)?(fu[0]||""):(fu||"")).toString().trim()}
function _meetRow(m){const done=!!m.completed_at;const loc=m.location_or_link||"";const ps=m.participants||[];
  let metas="";
  if(ps.length)metas+=`<div class="mm"><i class="ti ti-users"></i>${esc(ps.length>2?ps.slice(0,2).join(", ")+" +"+(ps.length-2):ps.join(", "))}</div>`;
  if(loc)metas+=`<div class="mm"><i class="ti ti-${_isLink(loc)?'video':'map-pin'}"></i>${esc(loc)}</div>`;
  let badges="";
  if(done||_hasProtocol(m))badges='<div class="mbadges">'+(done?'<span class="chip green"><i class="ti ti-check" style="font-size:11px;vertical-align:-1px"></i> Bo\'ldi</span>':'')+(_hasProtocol(m)?'<span class="chip violet"><i class="ti ti-file-text" style="font-size:11px;vertical-align:-1px"></i> Bayonnoma</span>':'')+'</div>';
  return `<div class="mrow"><div class="mtime">${_hm(m.datetime_start)}</div><div class="mrail"><div class="mdot ${done?'done':''}">${done?'<i class="ti ti-check"></i>':''}</div></div><div class="mc ${done?'dim':''}" onclick="meetingDetail('${m.id}')"><div class="mt">${esc(m.title)}</div>${metas}${badges}</div></div>`}
async function renderMeetings(box){
  const d=await api("/meetings");const list=d.meetings||[];
  list.forEach(x=>CACHE.meetings[x.id]=x);
  const now=Date.now();
  const mf=m=>{if(MFILTER==="hammasi")return true;const past=!!(m.completed_at||new Date(m.datetime_start).getTime()<now);return MFILTER==="otgan"?past:!past;};
  const sel=list.filter(mf).sort((a,b)=>MFILTER==="otgan"?(new Date(b.datetime_start)-new Date(a.datetime_start)):(new Date(a.datetime_start)-new Date(b.datetime_start)));
  let rows="",lastKey="";
  sel.forEach(m=>{const key=new Date(m.datetime_start).toDateString();
    if(key!==lastKey){rows+=`<div class="grp">${_dayLabel(m.datetime_start)}</div>`;lastKey=key;}
    rows+=_meetRow(m);});
  const chip=(k,l)=>`<button class="${MFILTER===k?'on':''}" onclick="setMF('${k}')">${l}</button>`;
  box.innerHTML=hdr("Uchrashuvlar","")+`<div class="flt">${chip("yaqin","Yaqin")}${chip("otgan","O'tgan")}${chip("hammasi","Hammasi")}</div>`+
    (sel.length?`<div class="mtl">${rows}</div>`:emptyBox("calendar-off","Uchrashuv yo'q"));
}
async function renderNotes(box){
  const d=await api("/notes");const list=d.notes||[];
  list.forEach(x=>CACHE.notes[x.id]=x);
  box.innerHTML=hdr("Qaydlar","")+(list.length?list.map(n=>`<div class="card">
    <div style="font-size:15px;font-weight:500">${esc(n.title||"Qayd")}</div>
    <div style="font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5">${esc((n.content||"").slice(0,180))}</div>
    <div class="rowbtns"><button class="btn" onclick="openNote('${n.id}')"><i class="ti ti-edit"></i> Tahrir</button>
      <button class="btn dang" onclick="del('/notes/${n.id}','notes')"><i class="ti ti-trash"></i></button></div></div>`).join(""):emptyBox("note","Qayd yo'q"));
}
async function renderReminders(box){
  const d=await api("/reminders");const list=d.reminders||[];
  list.forEach(x=>CACHE.reminders[x.id]=x);

async function download(path,fallback){
  flash("Yuklanmoqda…");
  try{
    const r=await fetch("/api"+path,{credentials:"same-origin",headers:{"Authorization":AUTH}});
    if(!r.ok){let e="Xato "+r.status;try{e=(await r.json()).error||e}catch{}return flash("⚠️ "+e);}
    const blob=await r.blob();
    const cd=r.headers.get("Content-Disposition")||"";const mm=cd.match(/filename="?([^"]+)"?/);
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=(mm?mm[1]:fallback);document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);flash("Yuklab olindi ✓");
  }catch(e){flash("⚠️ "+e.message);}
}

let _rec=null,_chunks=[];
async function toggleMic(){
  if(_rec&&_rec.state==="recording"){_rec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){return flash("Bu qurilmada ovoz qo'llab-quvvatlanmaydi");}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _rec=new MediaRecorder(stream);_chunks=[];
    _rec.ondataavailable=e=>{if(e.data.size)_chunks.push(e.data);};
    _rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());
      const mic=$("micbtn");if(mic)mic.innerHTML='<i class="ti ti-microphone"></i>';
      const blob=new Blob(_chunks,{type:_rec.mimeType||"audio/webm"});flash("O'girilmoqda…");
      try{const r=await fetch("/api/voice?name=voice.webm",{method:"POST",credentials:"same-origin",headers:{"Authorization":AUTH},body:blob});
        const j=await r.json();if(r.ok&&j.text){$("chatq").value=j.text;$("chatq").focus();flash("Tayyor — tekshirib yuboring");}
        else flash("⚠️ "+(j.error||"tushunilmadi"));
      }catch(e){flash("⚠️ "+e.message);}};
    _rec.start();const mic=$("micbtn");if(mic)mic.innerHTML='<i class="ti ti-player-stop"></i>';
    flash("Yozilmoqda… to'xtatish uchun mikrofonni bosing");
  }catch(e){flash("Mikrofonга ruxsat berilmadi");}
}

  if(hasP)h+=`<div class="protobox">${esc(_protoText(m))}</div><div class="dlrow"><button class="btn pri" onclick="download('/protocols/${m.id}/download?fmt=word','bayonnoma.docx')"><i class="ti ti-file-word"></i> Word</button><button class="btn" onclick="download('/protocols/${m.id}/download?fmt=pdf','bayonnoma.pdf')"><i class="ti ti-file-typography"></i> PDF</button><button class="btn" onclick="openProtocol('${m.id}')" title="Qayta yaratish"><i class="ti ti-refresh"></i></button></div>`;
  else h+=`<button class="btn pri" style="width:100%" onclick="openProtocol('${m.id}')"><i class="ti ti-file-text"></i> Bayonnoma yaratish</button>`;
  h+=`<div class="macts">${done?`<button class="btn" onclick="closeM();mReopen('${m.id}')"><i class="ti ti-rotate-2"></i> Qayta ochish</button>`:`<button class="btn pri" onclick="closeM();mDone('${m.id}')"><i class="ti ti-check"></i> Yakunlash</button>`}<button class="btn" onclick="editMeeting('${m.id}')"><i class="ti ti-edit"></i> Tahrir</button></div>`;
  h+=`<div class="macts" style="margin-top:9px"><button class="btn dang" style="flex:1" onclick="closeM();mCancel('${m.id}')"><i class="ti ti-trash"></i> Bekor qilish</button></div>`;
  return h}
async function meetingDetail(id){let m=CACHE.meetings[id];
  if(!m){try{m=(await api("/meetings/"+id)).meeting;if(m)CACHE.meetings[id]=m;}catch(e){return flash("Uchrashuv topilmadi");}}
  if(!m)return flash("Uchrashuv topilmadi");
  openM(meetingDetailHtml(m));}
function openProtocol(id){const m=CACHE.meetings[id]||{};openM(`<h3>Bayonnoma yaratish</h3>
  <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(m.title||"")}</div>
  <label>Uchrashuvda nimalar muhokama qilindi?</label>
  <textarea id="f_pnotes" style="min-height:130px" placeholder="Muhokama mavzulari, qabul qilingan qarorlar, kim nima qiladi va qachonga..."></textarea>
  <label style="display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:var(--text)"><input type="checkbox" id="f_ptasks" style="width:auto" checked> Follow-up vazifalar avtomatik qo'shilsin</label>
  <div class="macts"><button class="btn" onclick="meetingDetail('${id}')">Ortga</button><button class="btn pri" id="pgen" onclick="genProtocol('${id}')"><i class="ti ti-sparkles"></i> Bayonnoma yarat</button></div>`)}
async function genProtocol(id){const notes=val("f_pnotes");if(!notes)return flash("Avval matn yozing");
  const ct=!!($("f_ptasks")&&$("f_ptasks").checked);const btn=$("pgen");
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Tayyorlanmoqda…';}
  try{const r=await api(`/meetings/${id}/protocol`,{method:"POST",body:JSON.stringify({notes,create_tasks:ct})});
    if(r.meeting)CACHE.meetings[id]=r.meeting;
    flash("Bayonnoma tayyor"+(r.tasks_created?` · ${r.tasks_created} vazifa qo'shildi`:(r.tasks_failed?" · vazifalarni qo'shib bo'lmadi":"")));
    meetingDetail(id);render(VIEW);
  }catch(e){flash("⚠️ "+e.message);if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-sparkles"></i> Bayonnoma yarat';}}}
async function saveMeeting(id){const b={title:val("f_title"),datetime_start:fromLocal(val("f_start")),datetime_end:fromLocal(val("f_end")),location_or_link:val("f_loc"),participants:val("f_part").split(",").map(s=>s.trim()).filter(Boolean),agenda:val("f_ag")};
  if(!b.title)return flash("Sarlavha kerak");await act(()=>api(id?`/meetings/${id}`:"/meetings",{method:id?"PATCH":"POST",body:JSON.stringify(b)}),"Saqlandi");closeM()}

function noteForm(n={}){return `<h3>${n.id?"Qaydni tahrirlash":"Yangi qayd"}</h3>
  <label>Sarlavha</label><input id="f_title" value="${esc(n.title)}">
  <label>Matn</label><textarea id="f_content" style="min-height:120px">${esc(n.content)}</textarea>
  <div class="macts"><button class="btn" onclick="closeM()">Bekor</button><button class="btn pri" onclick="saveNote('${n.id||""}')">Saqlash</button></div>`}
const openNote=x=>openM(noteForm(typeof x==="object"?(x||{}):(CACHE.notes[x]||{})));
async function saveNote(id){const b={title:val("f_title"),content:val("f_content")};
  if(!b.content)return flash("Matn kerak");await act(()=>api(id?`/notes/${id}`:"/notes",{method:id?"PATCH":"POST",body:JSON.stringify(b)}),"Saqlandi");closeM()}

function reminderForm(r={}){return `<h3>${r.id?"Eslatmani tahrirlash":"Yangi eslatma"}</h3>
  <label>Sarlavha</label><input id="f_title" value="${esc(r.title)}">
  <label>Vaqt</label><input type="datetime-local" id="f_at" value="${toLocal(r.remind_at)}">
  <label>Izoh</label><input id="f_note" value="${esc(r.note)}">
  <div class="macts"><button class="btn" onclick="closeM()">Bekor</button><button class="btn pri" onclick="saveReminder('${r.id||""}')">Saqlash</button></div>`}
const openReminder=x=>openM(reminderForm(typeof x==="object"?(x||{}):(CACHE.reminders[x]||{})));
async function saveReminder(id){const b={title:val("f_title")||"Eslatma",remind_at:fromLocal(val("f_at")),note:val("f_note")};
  if(!b.remind_at)return flash("Vaqt kerak");await act(()=>api(id?`/reminders/${id}`:"/reminders",{method:id?"PATCH":"POST",body:JSON.stringify(b)}),"Saqlandi");closeM()}

// ── Search overlay ──
function closeOv(id){$(id).classList.remove("show");}
function openSearch(){$("searchov").classList.add("show");setTimeout(()=>$("searchq").focus(),120);}
let _st;
function doSearch(q){clearTimeout(_st);_st=setTimeout(()=>runSearch(q),260);}
function srCard(kind,id,title,sub){
  let acts="";
  if(kind==="task"||kind==="reminder")acts+=`<button class="btn pri" onclick="event.stopPropagation();srDone('${kind}','${id}')"><i class="ti ti-check"></i></button>`;
  if(kind==="meeting")acts+=`<button class="btn pri" onclick="event.stopPropagation();srDone('meeting','${id}')">Bo'ldi</button>`;
  acts+=`<button class="btn dang" onclick="event.stopPropagation();srDel('${kind}','${id}')"><i class="ti ti-trash"></i></button>`;
  return `<div class="card" onclick="srOpen('${kind}','${id}')">
    <div style="font-size:14px;font-weight:500">${esc(title)}</div>${sub?`<div style="font-size:12px;color:var(--muted);margin-top:3px">${esc(sub)}</div>`:''}
    <div class="rowbtns">${acts}</div></div>`;}
function srOpen(kind,id){closeOv("searchov");
  ({task:openTask,meeting:openMeeting,note:openNote,reminder:openReminder}[kind]||(()=>{}))(id);}
async function srDone(kind,id){const p={task:`/tasks/${id}/complete`,reminder:`/reminders/${id}/complete`,meeting:`/meetings/${id}/complete`}[kind];
  try{await api(p,{method:"POST"});flash("Bajarildi");runSearch($("searchq").value);}catch(e){flash("⚠️ "+e.message);}}
function srDel(kind,id){
  const cancel=(kind==="meeting");const p=cancel?`/meetings/${id}/cancel`:{task:`/tasks/${id}`,note:`/notes/${id}`,reminder:`/reminders/${id}`}[kind];
  if(!p)return;const run=async()=>{try{await api(p,{method:cancel?"POST":"DELETE"});flash("Bajarildi");runSearch($("searchq").value);}catch(e){flash("⚠️ "+e.message);}};
  if(tg?.showConfirm)tg.showConfirm("Bajarilsinmi?",ok=>{if(ok)run()});else run();}
async function runSearch(q){const box=$("searchres");
  if((q||"").trim().length<2){box.innerHTML='<div class="srhint">Kamida 2 harf yozing</div>';return;}
  box.innerHTML='<div class="srhint">Qidirilmoqda…</div>';
  try{const r=await api("/search?q="+encodeURIComponent(q.trim()));let html="";
    const sec=(t,arr,fn)=>{if(arr&&arr.length){html+=`<div class="sec"><h2 style="font-size:13px;color:var(--faint)">${t} (${arr.length})</h2></div>`;arr.forEach(fn);}};
    sec("Vazifalar",r.tasks,x=>{CACHE.tasks[x.id]=x;html+=srCard('task',x.id,x.title,(PRIO[x.priority]||'')+(x.assignee?' · '+x.assignee:''));});
    sec("Uchrashuvlar",r.meetings,x=>{CACHE.meetings[x.id]=x;html+=srCard('meeting',x.id,x.title,fmt(x.datetime_start));});
    sec("Qaydlar",r.notes,x=>{CACHE.notes[x.id]=x;html+=srCard('note',x.id,x.title||'Qayd',(x.content||'').slice(0,80));});
    sec("Eslatmalar",r.reminders,x=>{CACHE.reminders[x.id]=x;html+=srCard('reminder',x.id,x.title,fmt(x.remind_at));});
    box.innerHTML=html||'<div class="srhint">Hech narsa topilmadi</div>';
  }catch(e){box.innerHTML='<div class="srhint">⚠️ '+esc(e.message)+'</div>';}}

// ── AI chat overlay ──
function openChat(){$("chatov").classList.add("show");
  if(!$("chatmsgs").dataset.init){appendMsg("a","Salom! Nima qilay? Masalan: \"ertaga 15:00da Karimov bilan uchrashuv\" yoki \"bugungi vazifalarim\".");$("chatmsgs").dataset.init="1";}
  setTimeout(()=>$("chatq").focus(),120);}
function appendMsg(cls,text){const m=document.createElement("div");m.className="msg "+cls;m.textContent=text;
  $("chatmsgs").appendChild(m);$("chatmsgs").scrollTop=$("chatmsgs").scrollHeight;return m;}
let _chatBusy=false;
async function sendChat(){if(_chatBusy)return;const inp=$("chatq");const q=(inp.value||"").trim();if(!q)return;
  inp.value="";appendMsg("u",q);const th=appendMsg("a","…");_chatBusy=true;
  try{const r=await api("/chat",{method:"POST",body:JSON.stringify({message:q})});
    th.textContent=r.reply||"Bajarildi.";
    (r.views||[]).forEach(_chatView);
    if(r.download)_chatDownload(r.download);
    if(r.confirm_token){
      const doIt=async()=>{const r2=await api("/chat/confirm",{method:"POST",body:JSON.stringify({token:r.confirm_token})});
        appendMsg("a",r2.reply+_summary(r2.created));render(VIEW);};
      if(tg?.showConfirm)tg.showConfirm(r.confirm_prompt||"Bajarilsinmi?",ok=>{if(ok)doIt();else appendMsg("a","Bekor qilindi.");});
      else if(confirm(r.confirm_prompt||"Bajarilsinmi?"))doIt();
    }else{const s=_summary(r.created);if(s)th.textContent+=s;if(s||r.refresh)render(VIEW);}
  }catch(e){th.textContent="⚠️ "+e.message;}
  _chatBusy=false;}
function _summary(c){c=c||{};const nm={task:"vazifa",meeting:"uchrashuv",note:"qayd",reminder:"eslatma"};
  const bits=Object.keys(c).map(k=>c[k]+" "+(nm[k]||k));return bits.length?"\n\n✓ "+bits.join(", "):"";}
// Render a show_* result (tasks/meetings/notes/reminders/contacts/stats) as an inline card.
const _CVLBL={tasks:{active:"Faol vazifalar",all:"Barcha vazifalar",today:"Bugungi vazifalar",overdue:"Kechikkan vazifalar",important:"Muhim vazifalar",done:"Bajarilgan vazifalar"},
  meetings:{today:"Bugungi uchrashuvlar",tomorrow:"Ertangi uchrashuvlar",week:"Shu hafta uchrashuvlar",all:"Barcha uchrashuvlar",past:"O'tgan uchrashuvlar"}};
function _cvCard(icon,title,bodyHTML,openView){
  const box=document.createElement("div");box.className="cv";
  box.innerHTML=`<div class="cvh"><i class="ti ti-${icon}"></i>${esc(title)}</div>`+bodyHTML+
    (openView?`<div class="cvopen" onclick="closeOv('chatov');go('${openView}')">Bo'limni ochish →</div>`:"");
  $("chatmsgs").appendChild(box);$("chatmsgs").scrollTop=$("chatmsgs").scrollHeight;}
function _cvRows(items,n,rowFn){
  if(!items.length)return '<div class="cvempty">Topilmadi</div>';
  let h=items.slice(0,n).map(rowFn).join("");
  if(items.length>n)h+=`<div class="cvmore">va yana ${items.length-n} ta…</div>`;
  return h;}
function _chatView(v){
  const it=v.items||[];
  if(v.kind==="tasks"){it.forEach(t=>CACHE.tasks[t.id]=t);
    _cvCard("checklist",(_CVLBL.tasks[v.filter]||"Vazifalar")+` (${it.length})`,
      _cvRows(it,12,t=>{const c=PCOL[t.priority]||"var(--brand)";const dn=t.status==="done";
        return `<div class="cvr" onclick="openTask('${t.id}')"><span class="cvd" style="background:${c}"></span><span style="${dn?'text-decoration:line-through;color:var(--faint)':''}">${esc(t.title)}</span>${t.deadline?`<span class="cvm">${fmt(t.deadline)}</span>`:""}</div>`;}),
      "tasks");
  }else if(v.kind==="meetings"){it.forEach(m=>CACHE.meetings[m.id]=m);
    _cvCard("users",(_CVLBL.meetings[v.filter]||"Uchrashuvlar")+` (${it.length})`,
      _cvRows(it,12,m=>`<div class="cvr" onclick="openMeeting('${m.id}')"><i class="ti ti-clock cvd2"></i><span>${esc(m.title)}</span><span class="cvm">${fmt(m.datetime_start)}</span></div>`),
      "meetings");
  }else if(v.kind==="notes"){
    _cvCard("note",`Qaydlar (${it.length})`,
      _cvRows(it,12,n=>`<div class="cvr" onclick="closeOv('chatov');go('notes')"><i class="ti ti-point cvd2"></i><span>${esc(n.title||n.content||'')}</span></div>`),
      "notes");
  }else if(v.kind==="reminders"){
    _cvCard("bell",`Eslatmalar (${it.length})`,
      _cvRows(it,12,r=>`<div class="cvr" onclick="closeOv('chatov');go('reminders')"><i class="ti ti-bell cvd2"></i><span>${esc(r.title||'')}</span><span class="cvm">${fmt(r.remind_at)}</span></div>`),
      "reminders");
  }else if(v.kind==="contacts"){
    _cvCard("address-book",`Jamoa (${it.length})`,
      _cvRows(it,15,c=>`<div class="cvr" onclick="closeOv('chatov');go('team')"><i class="ti ti-user cvd2"></i><span>${esc(c.name||'')}</span>${c.role?`<span class="cvm">${esc(c.role)}</span>`:""}</div>`),
      "team");
  }else if(v.kind==="stats"){const t=(v.stats||{}).tasks||{};
    _cvCard("chart-bar",`Statistika (${v.days} kun)`,
      `<div class="cvstat"><div><b>${t.done||0}</b><span>bajarildi</span></div><div><b>${t.active||0}</b><span>faol</span></div><div><b>${t.overdue||0}</b><span>kechikkan</span></div><div><b>${t.due_24h||0}</b><span>24 soatda</span></div></div>`,
      "insights");
  }else if(v.kind==="slots"){const wk=v.range==="week";
    const dfmt=iso=>{const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString("uz",{weekday:"long",day:"numeric",month:"long"});};
    const body=(v.days||[]).map(d=>{const sl=d.slots||[];
      return (wk?`<div class="cvr" style="font-weight:600;color:var(--muted)"><span>${esc(dfmt(d.date))}</span></div>`:"")+
        (sl.length?sl.map(s=>`<div class="cvr"><i class="ti ti-clock cvd2" style="color:var(--green)"></i><span>${s.start}–${s.end}</span><span class="cvm">${s.mins} daq</span></div>`).join("")
          :`<div class="cvempty">Bo'sh vaqt yo'q</div>`);}).join("");
    _cvCard("clock-hour-9",wk?"Bo'sh vaqt (shu hafta)":"Bo'sh vaqt (09:00–18:00)",body,"calendar");
  }}
function _chatDownload(d){const box=document.createElement("div");box.className="cvdl";
  box.innerHTML=`<button><i class="ti ti-file-spreadsheet"></i>Excel yuklab olish</button>`;
  box.querySelector("button").onclick=()=>download(d.path,d.name||"export.xlsx");
  $("chatmsgs").appendChild(box);$("chatmsgs").scrollTop=$("chatmsgs").scrollHeight;}

$("fab").onclick=()=>({dash:()=>openTask({}),tasks:()=>openTask({}),meetings:()=>openMeeting({}),notes:()=>openNote({}),reminders:()=>openM(reminderForm({})),insights:()=>openTask({}),profile:()=>openTask({})}[VIEW]());
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchView(b.dataset.v));

// ── Browser login (Telegram Login Widget) — HOZIRCHA O'CHIRILGAN. ──
// Domen BotFather'да ro'yxatdan o'tmagani uchun ("Bot domain invalid") brauzer
// login vaqtincha o'chirildi; ilova faqat Telegram ichida ochiladi. Qayta yoqish
// uchun: quyidagi showLogin() ичига Login Widget skriptini qaytaring (git tarixida).
// onTGAuth + /api/auth/telegram + sessiya backend'да saqlanib qoldi (uxlab turibdi).
window.onTGAuth=async(user)=>{
  try{await api("/auth/telegram",{method:"POST",body:JSON.stringify(user)});location.reload();}
  catch(e){_fatal("Kirish rad etildi: "+e.message);}
};
async function showLogin(){
  let bot="";try{bot=(await (await fetch("/api/config")).json()).bot;}catch(e){}
  document.querySelector("nav").style.display="none";$("fab").style.display="none";
  const w=document.createElement("div");
  w.style.cssText="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--bg);z-index:50";
  w.innerHTML='<div style="width:64px;height:64px;border-radius:20px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px"><i class="ti ti-brand-telegram"></i></div>'
    +'<div style="font-size:22px;font-weight:600;color:var(--text)">Yordamchi Pro</div>'
    +'<div style="font-size:14px;color:var(--muted);max-width:290px;line-height:1.55">Bu ilova hozircha faqat Telegram ichida ochiladi. Botni oching va menyudagi tugma orqali kiring.</div>'
    +(bot?`<a href="https://t.me/${bot}" style="margin-top:6px;background:var(--brand);color:#fff;text-decoration:none;padding:12px 24px;border-radius:13px;font-size:15px;font-weight:600"><i class="ti ti-brand-telegram" style="vertical-align:-2px;margin-right:5px"></i>Telegramда ochish</a>`:'');
  document.body.appendChild(w);
}
(async()=>{
  // Not inside Telegram (no initData) → require a browser session; 401 → login page.
  if(!(tg&&tg.initData)){
    try{await api("/me");}catch(e){return showLogin();}
  }
  try{META=await api("/meta")}catch(e){}
  render("dash");
})();
</script>
